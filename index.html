<!doctype html>
<html lang="en" data-theme="royal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Om-AI-Master — autonomous farm & wealth console with multilingual voice control (Gujarati / Hindi / English), secure document vault and live agent telemetry." />
<meta name="theme-color" content="#04060f" />
<meta name="color-scheme" content="dark light" />
<title>Om-AI-Master · Autonomous Console</title>
<!-- inline data-URI favicon: prevents the /favicon.ico 404 on GitHub Pages -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1024'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fcd34d' font-family='sans-serif'%3E%E0%A5%90%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1024'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fcd34d' font-family='sans-serif'%3E%E0%A5%90%3C/text%3E%3C/svg%3E" />
<style>
/* ================= THEME TOKENS ================= */
:root{
  --bg:#04060f;
  --glow:radial-gradient(circle at 20% 0%,rgba(37,99,235,.18),transparent 55%),radial-gradient(circle at 90% 100%,rgba(251,191,36,.10),transparent 50%);
  --panel:rgba(8,12,28,.80); --panel2:rgba(255,255,255,.035);
  --border:rgba(255,255,255,.09);
  --accent:#fcd34d; --accent2:#3b82f6; --accentFg:#0a1024;
  --accentSoft:rgba(252,211,77,.12); --accentBorder:rgba(252,211,77,.32);
  --text:#e2e8f0; --muted:#94a3b8; --ok:#34d399; --bad:#fb7185;
  --userBg:rgba(59,130,246,.15); --userBorder:rgba(96,165,250,.35);
}
[data-theme="emerald"]{
  --bg:#03100c;
  --glow:radial-gradient(circle at 15% 0%,rgba(16,185,129,.22),transparent 55%),radial-gradient(circle at 95% 100%,rgba(6,182,212,.14),transparent 50%);
  --panel:rgba(4,24,19,.82); --border:rgba(52,211,153,.16);
  --accent:#34d399; --accent2:#06b6d4; --accentFg:#032018;
  --accentSoft:rgba(52,211,153,.12); --accentBorder:rgba(52,211,153,.35);
  --text:#d1fae5; --muted:#7fa79b; --userBg:rgba(6,182,212,.16); --userBorder:rgba(34,211,238,.35);
}
[data-theme="light"]{
  --bg:#f4f6fb;
  --glow:radial-gradient(circle at 20% 0%,rgba(37,99,235,.12),transparent 55%),radial-gradient(circle at 90% 100%,rgba(217,119,6,.10),transparent 50%);
  --panel:rgba(255,255,255,.92); --panel2:rgba(15,23,42,.04); --border:rgba(15,23,42,.12);
  --accent:#b45309; --accent2:#2563eb; --accentFg:#fff;
  --accentSoft:rgba(180,83,9,.10); --accentBorder:rgba(180,83,9,.30);
  --text:#0f172a; --muted:#64748b; --ok:#047857;
  --userBg:rgba(37,99,235,.12); --userBorder:rgba(37,99,235,.30);
}
[data-theme="cyber"]{
  --bg:#0a0316;
  --glow:radial-gradient(circle at 15% 0%,rgba(217,70,239,.25),transparent 55%),radial-gradient(circle at 95% 100%,rgba(34,211,238,.20),transparent 50%);
  --panel:rgba(20,5,40,.82); --border:rgba(232,121,249,.20);
  --accent:#f0abfc; --accent2:#22d3ee; --accentFg:#16021f;
  --accentSoft:rgba(240,171,252,.12); --accentBorder:rgba(240,171,252,.40);
  --text:#f5e8ff; --muted:#a78bbd; --ok:#4ade80;
  --userBg:rgba(34,211,238,.16); --userBorder:rgba(34,211,238,.40);
}

/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:ui-sans-serif,system-ui,"Segoe UI","Noto Sans Gujarati","Noto Sans Devanagari",sans-serif;
  background-color:var(--bg);background-image:var(--glow);color:var(--text);
  overflow:hidden;transition:background-color .35s,color .35s;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--accentBorder);border-radius:9px}
::placeholder{color:var(--muted);opacity:.7}
.app{display:flex;height:100vh;width:100vw;overflow:hidden}
.panel{background:var(--panel);backdrop-filter:blur(14px)}
.p2{background:var(--panel2)}
.acc{color:var(--accent)} .muted{color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.soft{background:var(--accentSoft);border:1px solid var(--accentBorder);color:var(--accent)}
.solid{background:var(--accent);color:var(--accentFg);border:1px solid var(--accent)}
.row{display:flex;align-items:center}
.hide{display:none !important}
.tag{font-size:9px;letter-spacing:.22em;text-transform:uppercase}

/* ================= LEFT NAV ================= */
.nav{width:216px;flex:0 0 auto;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0;position:relative;transition:width .3s}
.nav.collapsed{width:68px}
.nav.collapsed .lbl,.nav.collapsed .navfoot span{display:none}
.nav.collapsed .navbtn,.nav.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;margin-bottom:18px}
.omk{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;font-weight:800;font-size:17px}
.navbtn{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:2px 8px;padding:10px 12px;border-radius:12px;font-size:13px;color:var(--muted);text-align:left;transition:.15s}
.navbtn:hover{background:var(--accentSoft);color:var(--accent)}
.navbtn.on{background:var(--accentSoft);border:1px solid var(--accentBorder);color:var(--accent)}
.navfoot{margin-top:auto;padding:0 14px;font-size:10px;color:var(--muted)}
.collapse{position:absolute;top:22px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;z-index:30;font-size:11px}
.nav .collapse{right:-13px} .side .collapse{left:-13px}

/* ================= CENTER ================= */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
h1{font-size:13px;letter-spacing:.24em;font-weight:600}
.sub{font-size:10px;letter-spacing:.14em;color:var(--accent)}
.kpis{display:flex;gap:22px}
.kpi p:first-child{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;text-align:right}
.kpi p:last-child{font-size:13px;color:var(--accent);text-align:right}
.pill{display:flex;border:1px solid var(--accentBorder);border-radius:99px;padding:2px}
.pill button{padding:4px 9px;border-radius:99px;font-size:10px;font-weight:700;color:var(--muted)}
.pill button.on{background:var(--accent);color:var(--accentFg)}
.iconbtn{border-radius:99px;padding:6px 10px;font-size:10px;font-weight:700}
.swatch{display:inline-flex}
.swatch i{width:13px;height:13px;border-radius:50%;margin-left:-4px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.swatch i:first-child{margin-left:0}
.dropdown{position:absolute;top:44px;right:0;width:225px;border:1px solid var(--border);border-radius:14px;padding:7px;z-index:60;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.dropdown button{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:10px;font-size:12px;text-align:left;color:var(--text)}
.dropdown button:hover{background:var(--accentSoft)}
.dropdown button.on{background:var(--accentSoft);color:var(--accent)}

/* ---- chat ---- */
.stream{flex:1 1 auto;min-height:0;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.wrap{width:100%;max-width:760px;margin:0 auto}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.bub{max-width:86%;border:1px solid var(--border);background:var(--panel2);border-radius:16px;padding:11px 15px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.msg.me .bub{background:var(--userBg);border-color:var(--userBorder)}
.meta{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.24em;color:var(--accent);margin-bottom:5px}
.vtag{background:var(--accentSoft);border-radius:99px;padding:1px 6px;font-size:8px;letter-spacing:.1em}
.acts{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.acts button{display:flex;align-items:center;gap:5px;border-radius:9px;padding:4px 8px;font-size:10px;font-weight:600}
.acts .loc{margin-left:auto;font-size:9px;letter-spacing:.18em;color:var(--muted)}
.viewport{border:1px solid var(--accentBorder);border-radius:16px;padding:14px}
.screenbox{height:170px;display:grid;place-items:center;border:1px solid var(--border);border-radius:12px;margin-top:12px;background:linear-gradient(120deg,var(--accentSoft),transparent);text-align:center;padding:0 14px}
.spin{width:36px;height:36px;margin:0 auto 8px;border-radius:50%;border:2px solid var(--accentBorder);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- chatbar ---- */
.dock{border-top:1px solid var(--border);padding:14px 20px}
.bar{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:16px;padding:8px;position:relative}
.bar input.txt{flex:1 1 auto;min-width:0;background:none;border:none;outline:none;font-size:13.5px;padding:0 6px}
.circ{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border-radius:12px;font-size:17px;transition:.2s}
.circ.rot{transform:rotate(45deg)}
.mic{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:12px;font-size:12px;font-weight:700;position:relative;overflow:hidden}
.mic.live::after{content:"";position:absolute;inset:0;background:var(--accentSoft);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.4)}}
.langsel{border:1px solid var(--border);background:var(--panel);border-radius:9px;padding:6px 6px;font-size:11px;outline:none}
.hint{position:absolute;top:-32px;left:50%;transform:translateX(-50%);max-width:96%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:99px;padding:4px 14px;font-size:11px}
.plusmenu{position:absolute;bottom:70px;left:0;width:336px;border:1px solid var(--accentBorder);border-radius:16px;padding:10px;z-index:50;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.plusmenu .item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:12px;text-align:left;color:var(--text)}
.plusmenu .item:hover{background:var(--accentSoft)}
.ico{width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;font-size:15px}
.urlbox{border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:8px}
.urlbox input{width:100%;background:var(--panel2);border:none;border-radius:8px;padding:6px 9px;font-size:11.5px;outline:none}
.disc{text-align:center;font-size:10px;color:var(--muted);margin-top:8px}

/* ================= RIGHT TELEMETRY ================= */
.side{width:332px;flex:0 0 auto;border-left:1px solid var(--border);position:relative;transition:width .3s;display:flex;flex-direction:column}
.side.collapsed{width:62px}
.side.collapsed .sfull{display:none}
.srail{display:none;flex-direction:column;align-items:center;gap:14px;padding-top:74px}
.side.collapsed .srail{display:flex}
.shead{padding:14px 18px;border-bottom:1px solid var(--border)}
.slist{flex:1 1 auto;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px}
.card{border:1px solid var(--border);background:var(--panel2);border-radius:13px;padding:11px;text-align:left;width:100%;transition:.15s}
.card:hover{border-color:var(--accentBorder);background:var(--accentSoft)}
.track{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;flex:1 1 auto}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .7s}
.chip{border:1px solid var(--accentBorder);background:var(--accentSoft);color:var(--accent);border-radius:99px;padding:2px 7px;font-size:9px;font-weight:800;letter-spacing:.1em}
.sfoot{border-top:1px solid var(--border);padding:10px 18px;font-size:10px;color:var(--accent)}
.toggle{width:38px;height:20px;border-radius:99px;position:relative;border:1px solid var(--border);transition:.2s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{left:20px}

/* ================= MODALS ================= */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:100}
.modal{width:100%;max-width:660px;border:1px solid var(--accentBorder);border-radius:18px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.7)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.mbody{max-height:70vh;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:10px}
.logline{display:flex;gap:10px;border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:7px 11px;font-size:11px}
.drop{border:1px dashed var(--accentBorder);border-radius:14px;padding:22px;text-align:center;cursor:pointer}
.drop:hover{background:var(--accentSoft)}
.docrow{display:flex;align-items:center;gap:11px;border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:9px 11px}
.kind{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;font-size:9px;font-weight:800}
.toastwrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{border-radius:99px;padding:8px 18px;font-size:12px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:up .25s ease-out}
@keyframes up{from{opacity:0;transform:translateY(10px)}}

/* ================= RESPONSIVE ================= */
@media (max-width:1180px){.kpis{display:none}}
@media (max-width:900px){.nav{display:none}.side{width:280px}.side.collapsed{width:54px}}
@media (max-width:640px){
  .side{position:fixed;right:0;top:0;bottom:0;z-index:80;width:300px;box-shadow:-20px 0 60px rgba(0,0,0,.6);transform:translateX(0);transition:transform .3s}
  .side.collapsed{width:300px;transform:translateX(100%)}
  .side .collapse{left:-14px}
  .side.collapsed .sfull{display:flex}
  .side.collapsed .srail{display:none}
  .fab{display:grid !important}
  .grid3{grid-template-columns:repeat(2,1fr)}
  .mic span:last-child,.acts button span{display:none}
  .langsel{display:none}
  .stream{padding:16px 12px}
  .dock{padding:10px 12px}
  .modal{max-height:92vh}
}
/* floating telemetry launcher (mobile only) */
.fab{display:none;position:fixed;right:14px;bottom:78px;width:46px;height:46px;border-radius:50%;place-items:center;font-size:18px;z-index:70;box-shadow:0 12px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="app">

  <!-- ============ LEFT NAV ============ -->
  <nav class="nav panel" id="nav">
    <button class="collapse soft" onclick="toggleNav()" id="navChev">‹</button>
    <div class="brand"><div class="omk soft">ॐ</div><span class="lbl" style="font-size:11px;letter-spacing:.2em;font-weight:700">OM-AI-MASTER</span></div>
    <div id="navList"></div>
    <div class="navfoot"><span>Om-AI-Master v5.0 · secure mesh</span></div>
  </nav>

  <!-- ============ CENTER CONSOLE ============ -->
  <div class="main">
    <header>
      <div class="row" style="gap:11px">
        <div class="omk soft">ॐ</div>
        <div><h1>OM-AI-MASTER</h1><p class="sub" id="hdrSub"></p></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="row" style="gap:8px">
        <button class="iconbtn soft" onclick="openVault()" title="Vault">🔐 <span id="docCount">3</span></button>
        <div style="position:relative">
          <button class="iconbtn soft row" style="gap:7px" onclick="toggleThemeMenu(event)">
            <span class="swatch" id="themeSwatch"></span><span id="themeLbl">Theme</span>
          </button>
          <div class="dropdown panel hide" id="themeMenu"></div>
        </div>
        <div class="pill" id="langPill"></div>
      </div>
    </header>

    <div class="stream" id="stream"></div>

    <div class="dock">
      <div class="wrap" style="position:relative">
        <div class="plusmenu panel hide" id="plusMenu"></div>
        <div class="hint soft hide" id="voiceHint"></div>
        <div class="bar panel">
          <button class="circ soft" id="plusBtn" onclick="togglePlus(event)">＋</button>
          <select class="langsel" id="langSel" onchange="setLang(this.value)"></select>
          <input class="txt" id="input" onkeydown="if(event.key==='Enter')sendText()" />
          <button class="circ" id="sendBtn" onclick="sendText()" style="background:var(--accent2);color:#fff">➤</button>
          <button class="mic soft" id="micBtn" onclick="toggleVoice()"><span style="position:relative">🎙</span><span id="micLbl">Voice</span></button>
        </div>
        <p class="disc" id="disc"></p>
      </div>
    </div>
  </div>

  <!-- ============ RIGHT TELEMETRY ============ -->
  <aside class="side panel" id="side">
    <button class="collapse soft" onclick="toggleSide()" id="sideChev">›</button>
    <div class="srail" id="srail"></div>
    <div class="sfull" style="display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div class="shead">
        <p class="acc tag" id="telLbl">Live Telemetry</p>
        <h2 style="font-size:13px;margin-top:3px" id="gridLbl">Om-AI-Master · Agent Grid</h2>
        <p class="muted" style="font-size:11px;margin-top:2px">4 units · mesh latency 38 ms</p>
      </div>
      <div class="slist">
        <!-- wealth widget -->
        <div class="card" style="cursor:default">
          <p class="acc tag">💰 <span id="wealthLbl">Wealth &amp; Payouts</span></p>
          <p class="muted" style="font-size:10px;margin-top:7px" id="earnLbl">Accumulated earnings</p>
          <p class="acc mono" style="font-size:21px" id="balance">₹0</p>
          <p class="ok" style="font-size:10px" id="availLbl">Available · +₹412/hr autonomous yield</p>
          <p class="muted tag" style="margin-top:10px" id="routeLbl">Payout route</p>
          <select class="langsel" id="routeSel" style="width:100%;margin-top:4px" onchange="renderRoute()"></select>
          <p class="muted" style="font-size:10px;margin-top:4px" id="routeMeta"></p>
          <button class="solid" style="width:100%;margin-top:11px;border-radius:9px;padding:8px;font-size:12px;font-weight:700" onclick="withdrawAll()" id="wdBtn">Withdraw now →</button>
          <div class="row" style="justify-content:space-between;margin-top:11px;font-size:11px">
            <span class="muted" id="autoLbl">Autonomous payout</span>
            <button class="toggle on" id="autoTog" onclick="this.classList.toggle('on')"><i></i></button>
          </div>
          <div id="payoutLog" style="margin-top:9px;display:flex;flex-direction:column;gap:4px"></div>
        </div>
        <div id="agentList" style="display:flex;flex-direction:column;gap:11px"></div>
      </div>
      <div class="sfoot">⚡ Grid draw 12.4 kW · solar 78%</div>
    </div>
  </aside>
</div>

<button class="fab solid" onclick="toggleSide()" title="Telemetry">📡</button>
<div id="modalHost"></div>
<div class="toastwrap" id="toasts"></div>
<noscript><p style="padding:24px;text-align:center">Om-AI-Master requires JavaScript to run.</p></noscript>

<script>
/* =====================================================================
   OM-AI-MASTER — single-file autonomous console
   Sections: i18n · themes · data · speech · render · actions
   ===================================================================== */

/* ---------------- i18n ---------------- */
var LANGS=[{code:"gu-IN",native:"ગુજરાતી",short:"GU",label:"Gujarati"},
           {code:"hi-IN",native:"हिन्दी",short:"HI",label:"Hindi"},
           {code:"en-IN",native:"English",short:"EN",label:"English"}];

var T={

/* ---------------- WEB SPEECH: synthesis ---------------- */
function speak(text,l){
  if(!window.speechSynthesis)return false;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=l; u.rate=.98; u.pitch=1;
  var vs=window.speechSynthesis.getVoices();
  var v=vs.filter(function(x){return x.lang.replace("_","-")===l;})[0]
     || vs.filter(function(x){return x.lang.replace("_","-").indexOf(l.split("-")[0])===0;})[0]
     || vs.filter(function(x){return x.lang.indexOf("en")===0;})[0];
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
  return true;
}
if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices();};}

/* ---------------- WEB SPEECH: recognition ---------------- */
function toggleVoice(){
  if(listening){ if(rec)rec.stop(); return; }
  var Ctor=window.webkitSpeechRecognition||window.SpeechRecognition;
  if(!Ctor){ addMsg("om",t("unsupported"),false); return; }
  rec=new Ctor();
  rec.lang=lang; rec.continuous=false; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onstart=function(){listening=true;paintMic("");};
  rec.onresult=function(e){
    var fin="",part="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i];
      if(r.isFinal)fin+=r[0].transcript; else part+=r[0].transcript;
    }
    paintMic(part);
    if(fin.trim()){ handle(fin.trim(),true); }
  };
  rec.onerror=function(e){ addMsg("om","Speech error: "+e.error,false); };
  rec.onend=function(){ listening=false; paintMic(""); };
  try{ rec.start(); }catch(err){}
}
function paintMic(interim){
  var b=$("micBtn"),h=$("voiceHint");
  b.className="mic "+(listening?"solid live":"soft");
  $("micLbl").textContent=listening?t("listening"):t("voice");
  if(listening||interim){h.classList.remove("hide");h.textContent=interim||t("listening");}
  else h.classList.add("hide");
}

function handle(txt,spoken){
  addMsg("user",txt,spoken);
  var low=txt.toLowerCase();
  var hit=function(arr){return arr.some(function(w){return low.indexOf(w)>-1;});};
  if(hit(WITHDRAW_WORDS)){ withdrawAll(spoken); return; }
  if(hit(VAULT_WORDS)){
    openVault();
    var shared=DOCS.filter(function(d){return d.shared;}).length;
    respond({"gu-IN":"વૉલ્ટ ખૂલ્યું. "+DOCS.length+" દસ્તાવેજ સંગ્રહિત (આધાર + પાન સહિત), "+shared+" એજન્ટ માટે ઉપલબ્ધ.",
             "hi-IN":"वॉल्ट खुला। "+DOCS.length+" दस्तावेज़ संग्रहित (आधार व पैन सहित), "+shared+" एजेंट के लिए उपलब्ध।",
             "en-IN":"Vault opened. "+DOCS.length+" documents stored (incl. Aadhaar & PAN), "+shared+" shared with agents."}[lang],spoken);
    return;
  }
  var pool=REPLIES[lang];
  respond(pool[Math.floor(Math.random()*pool.length)],spoken);
}

  if(!speak(m.text,m.lang)){toast("TTS unavailable");return;}
  if(btn){btn.className="solid";btn.innerHTML="<b>⏹</b><span>"+esc(t("stop"))+"</span>";}
  var poll=setInterval(function(){
    if(!window.speechSynthesis.speaking){
      clearInterval(poll);
      var b=$("sp"+i);
      if(b){b.className="soft";b.innerHTML="<b>🔊</b><span>"+esc(t("speak"))+"</span>";}
    }
  },400);
}
/* --- per-message copy button with ✅ confirmation --- */
function copyMsg(i){
  var m=msgs[i],btn=$("cp"+i);
  var done=function(){
    if(btn){btn.className="solid";btn.innerHTML="<b>✅</b><span>"+esc(t("copied"))+"</span>";}
    toast("📋 "+t("copied"));
    setTimeout(function(){var b=$("cp"+i);if(b){b.className="soft";b.innerHTML="<b>📋</b><span>"+esc(t("copy"))+"</span>";}},1700);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(m.text).then(done,function(){fallbackCopy(m.text);done();});
  }else{fallbackCopy(m.text);done();}
}
function fallbackCopy(txt){
  var ta=document.createElement("textarea");
  ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
}
function closeViewport(){viewport=null;renderStream();}

/* ---------------- PLUS MENU ---------------- */
function togglePlus(e){
  e.stopPropagation();
  var m=$("plusMenu"),open=m.classList.contains("hide");
  m.classList.toggle("hide"); $("plusBtn").className="circ "+(open?"solid rot":"soft");
  if(open)renderPlus();
}
function renderPlus(){
  var items=[["camera","📷",t("camera")],["video","🎬",t("video")],["screen","🖥",t("screen")]];
  var h='<div class="row" style="justify-content:space-between;padding:0 8px 8px"><p class="acc tag">'+esc(t("modules"))+'</p>'+
        '<button class="muted" onclick="togglePlus(event)">✕</button></div>';
  items.forEach(function(it){
    h+='<button class="item" onclick="pickMode(\''+it[0]+'\')"><span class="ico soft">'+it[1]+'</span><span>'+esc(it[2])+'</span></button>';
  });
  h+='<button class="item" onclick="openVault();togglePlus(event)"><span class="ico soft">🔐</span><span><b style="display:block;font-size:13px">'+esc(t("vault"))+'</b><small class="muted">'+esc(t("vaultHint"))+'</small></span></button>';
  h+='<div class="urlbox"><p class="muted tag" style="margin-bottom:6px">🔗 '+esc(t("urlBox"))+'</p><div class="row" style="gap:7px">'+
     '<input id="urlIn" placeholder="'+esc(t("urlPh"))+'" onkeydown="if(event.key===\'Enter\')scanUrl()" />'+
     '<button class="solid" style="border-radius:8px;padding:6px 11px;font-size:11px;font-weight:700" onclick="scanUrl()">'+esc(t("scan"))+'</button></div></div>';
  $("plusMenu").innerHTML=h;
}
function pickMode(m){
  var notes={camera:"Field cam 03 · aperture locked · frame captured",
             video:"Live agent stream · 1080p60 · latency 42 ms",
             screen:"Broadcasting Om-AI-Master console to 3 operators"};
  viewport={title:t(m).toUpperCase(),note:notes[m],extra:""};
  togglePlus(event); renderStream();
}
function scanUrl(){
  var el=$("urlIn"); if(!el||!el.value.trim())return;
  var u=el.value.trim();
  viewport={title:t("urlBox").toUpperCase(),note:"Parsing "+u,extra:"Media resource · 3 frames extracted · crop stress score 0.21"};
  togglePlus(event); handle("🔗 "+u,false);
}
document.addEventListener("mousedown",function(e){
  var m=$("plusMenu");
  if(!m.classList.contains("hide")&&!m.contains(e.target)&&e.target.id!=="plusBtn"){m.classList.add("hide");$("plusBtn").className="circ soft";}
  var tm=$("themeMenu");
  if(tm&&!tm.classList.contains("hide")&&!tm.contains(e.target))tm.classList.add("hide");
});

/* ---------------- WEALTH ---------------- */
function renderRoute(){
  var r=ROUTES.filter(function(x){return x.id===$("routeSel").value;})[0];
  $("routeMeta").textContent=r.meta;
}
function withdrawAll(spoken){
  var r=ROUTES.filter(function(x){return x.id===$("routeSel").value;})[0]||ROUTES[0];
  var amt=balance; if(amt<=0){toast("No balance");return;}
  balance=0; payouts.unshift({amt:amt,route:r.label,time:now()});
  paintWealth();
  var ref="OM-"+String(Date.now()).slice(-6);
  respond({"gu-IN":"₹"+amt.toFixed(0)+" "+r.label+" મારફતે તમારા નોંધાયેલા ખાતામાં મોકલાયા. સંદર્ભ "+ref+".",
           "hi-IN":"₹"+amt.toFixed(0)+" "+r.label+" द्वारा आपके पंजीकृत खाते में भेजे गए। संदर्भ "+ref+"।",
           "en-IN":"₹"+amt.toFixed(0)+" released via "+r.label+" to your registered account. Ref "+ref+"."}[lang],!!spoken);
  toast("💸 "+r.label+" · ₹"+amt.toFixed(0));
}
function paintWealth(){
  $("balance").textContent=inr(balance);
  $("payoutLog").innerHTML=payouts.slice(0,3).map(function(p){
    return '<div class="row" style="justify-content:space-between;border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:10px">'+
           '<span class="muted">'+esc(p.route)+' · '+p.time+'</span><span class="ok mono">₹'+p.amt.toFixed(0)+' ✓</span></div>';
  }).join("");
  var k=$("kpis").querySelector("[data-k=wallet]");
  if(k)k.textContent="₹"+(balance/1000).toFixed(1)+"k";
}

/* ---------------- AGENTS ---------------- */
function renderAgents(){
  $("agentList").innerHTML=AGENTS.map(function(a){
    return '<button class="card" onclick="openAgent(\''+a.id+'\')">'+
     '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">'+
      '<div><p style="font-size:13px;font-weight:600">'+esc(a.name)+'</p><p class="acc" style="font-size:10px;letter-spacing:.2em">'+esc(a.code)+'</p></div>'+
      '<span class="chip">'+a.state+'</span></div>'+
     '<p class="muted" style="font-size:11px;margin-top:7px">'+esc(a.method)+'</p>'+
     '<div class="row" style="gap:8px;margin-top:9px"><div class="track"><div class="fill" style="width:'+a.progress+'%"></div></div>'+
      '<span class="mono" style="font-size:11px;width:34px;text-align:right">'+a.progress+'%</span></div>'+
     '<div class="row" style="justify-content:space-between;margin-top:7px;font-size:10px">'+
      '<span class="'+(a.delta>=0?"ok":"bad")+'">'+(a.delta>=0?"▲ "+a.delta+" "+t("ahead"):"▼ "+Math.abs(a.delta)+" "+t("behind"))+'</span>'+
      '<span class="muted">'+esc(t("drill"))+'</span></div></button>';
  }).join("");
  $("srail").innerHTML='<span class="acc" style="font-size:16px">💰</span>'+AGENTS.map(function(a){
    return '<button class="kind soft" onclick="openAgent(\''+a.id+'\')" title="'+esc(a.name)+'">'+a.code.slice(0,2)+'</button>';
  }).join("");
}
function openAgent(id){
  var a=AGENTS.filter(function(x){return x.id===id;})[0];
  var h='<div class="scrim" onclick="closeModal(event)"><div class="modal panel" onclick="event.stopPropagation()">'+
   '<div class="mhead"><div><p class="acc" style="font-size:10px;letter-spacing:.3em">OM-AI-MASTER · '+esc(a.code)+'</p>'+
   '<h3 style="font-size:19px;margin-top:3px">'+esc(a.name)+'</h3><p class="muted" style="font-size:12px">'+esc(a.method)+'</p></div>'+
   '<div class="row" style="gap:8px"><button class="soft" style="border-radius:9px;padding:7px 10px" onclick="speak(\''+esc(a.name)+'. '+a.progress+' percent.\',lang)">🔊</button>'+
   '<button class="soft" style="border-radius:9px;padding:7px 10px" onclick="closeModal()">✕</button></div></div><div class="mbody">'+
   '<div class="cell"><p class="muted tag">'+esc(t("task"))+'</p><p style="font-size:13px;margin-top:4px">'+esc(a.task)+'</p>'+
   '<div class="row" style="gap:10px;margin-top:10px"><div class="track" style="height:8px"><div class="fill" style="width:'+a.progress+'%"></div></div>'+
   '<span class="mono">'+a.progress+'%</span></div>'+
   '<p class="'+(a.delta>=0?"soft":"")+'" style="display:inline-block;border-radius:99px;padding:4px 11px;font-size:11px;margin-top:10px;'+(a.delta<0?"border:1px solid var(--bad);color:var(--bad)":"")+'">'+
     (a.delta>=0?"▲ "+a.delta+" "+t("ahead"):"▼ "+Math.abs(a.delta)+" "+t("behind"))+'</p></div>'+
   '<div><p class="muted tag" style="margin-bottom:8px">'+esc(t("metrics"))+'</p><div class="grid3">'+
     a.metrics.map(function(m){return '<div class="cell"><p class="muted" style="font-size:10px">'+esc(m[0])+'</p><p class="acc mono" style="font-size:13px;margin-top:3px">'+esc(m[1])+'</p></div>';}).join("")+
   '</div></div>'+
   '<div><p class="muted tag" style="margin-bottom:8px">'+esc(t("events"))+'</p>'+
     a.log.map(function(l,i){return '<div class="logline mono" style="margin-bottom:6px"><span class="acc">'+String(i+1).padStart(2,"0")+'</span>Om-AI-Master · '+esc(l)+'</div>';}).join("")+
   '</div></div></div></div>';
  $("modalHost").innerHTML=h;
}

/* ---------------- VAULT (Aadhaar / PAN layout) ---------------- */
function openVault(){
  var group=function(cat,title){
    var rows=DOCS.filter(function(d){return d.cat===cat;});
    if(!rows.length)return"";
    return '<div><p class="muted tag" style="margin-bottom:8px">'+esc(title)+'</p><div style="display:flex;flex-direction:column;gap:8px">'+
      rows.map(function(d){
        return '<div class="docrow"><span class="kind soft">'+d.kind+'</span>'+
        '<div style="flex:1;min-width:0"><p style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.name)+'</p>'+
        '<p class="muted mono" style="font-size:10.5px">'+esc(d.num)+' · '+d.size+' · '+d.added+'</p></div>'+
        '<button class="'+(d.shared?"solid":"soft")+'" style="border-radius:99px;padding:3px 9px;font-size:9px;font-weight:800" onclick="toggleDoc(\''+d.id+'\')">'+
          (d.shared?"AGENTS ✓":"PRIVATE")+'</button>'+
        '<button class="muted" onclick="delDoc(\''+d.id+'\')">✕</button></div>';
      }).join("")+'</div></div>';
  };
  $("modalHost").innerHTML='<div class="scrim" onclick="closeModal(event)"><div class="modal panel" onclick="event.stopPropagation()">'+
   '<div class="mhead"><div><p class="acc" style="font-size:10px;letter-spacing:.3em">🔐 OM-AI-MASTER</p>'+
   '<h3 style="font-size:18px;margin-top:3px">'+esc(t("vault"))+'</h3><p class="muted" style="font-size:12px">'+esc(t("vaultHint"))+'</p></div>'+
   '<button class="soft" style="border-radius:9px;padding:7px 10px" onclick="closeModal()">✕</button></div>'+
   '<div class="mbody">'+
   '<div class="drop" onclick="document.getElementById(\'fileIn\').click()" ondragover="event.preventDefault()" ondrop="dropFiles(event)">'+
     '<input type="file" id="fileIn" multiple hidden onchange="addFiles(this.files)" />'+
     '<p class="acc" style="font-size:22px">⬆</p><p style="font-size:13px;margin-top:4px">'+esc(t("upload"))+' · Aadhaar / PAN / PDF / PNG</p>'+
     '<p class="muted" style="font-size:11px">AES-256 client vault · zero-knowledge index</p></div>'+
   group("identity",t("identity"))+group("business",t("business"))+
   '<p class="muted" style="font-size:11px">🔗 Agents may cite documents marked <b>AGENTS ✓</b> when filing applications, KYC, or transactions on your behalf.</p>'+
   '</div></div></div>';
}
function toggleDoc(id){DOCS.forEach(function(d){if(d.id===id)d.shared=!d.shared;});openVault();}
function delDoc(id){DOCS=DOCS.filter(function(d){return d.id!==id;});$("docCount").textContent=DOCS.length;openVault();}
function dropFiles(e){e.preventDefault();addFiles(e.dataTransfer.files);}
function addFiles(files){
  if(!files)return;
  Array.prototype.forEach.call(files,function(f){
    var n=f.name.toLowerCase();
    DOCS.unshift({id:"d"+Date.now()+Math.random(),name:f.name,
      num:n.indexOf("aadhaar")>-1?"XXXX XXXX ••••":(n.indexOf("pan")>-1?"•••••••••":"encrypted"),
      cat:(n.indexOf("aadhaar")>-1||n.indexOf("pan")>-1||n.indexOf("id")>-1)?"identity":"business",
      kind:(f.name.split(".").pop()||"file").toUpperCase(),size:(f.size/1024).toFixed(0)+" KB",
      shared:true,added:new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit"})});
  });
  $("docCount").textContent=DOCS.length; openVault(); toast("🔐 "+t("upload")+" ✓");
}
function closeModal(e){if(e&&e.target&&!e.target.classList.contains("scrim"))return;$("modalHost").innerHTML="";}

/* ---------------- THEME / LANG / LAYOUT ---------------- */
function themeName(x){return lang==="gu-IN"?x.gu:lang==="hi-IN"?x.hi:x.en;}
function setTheme(id){
  theme=id; document.documentElement.setAttribute("data-theme",id);
  try{localStorage.setItem("om-theme",id);}catch(e){}
  var cur=THEMES.filter(function(x){return x.id===id;})[0];
  $("themeSwatch").innerHTML=cur.sw.map(function(c){return '<i style="background:'+c+'"></i>';}).join("");
  $("themeMenu").classList.add("hide");
  renderThemeMenu();
}
function renderThemeMenu(){
  $("themeMenu").innerHTML=THEMES.map(function(x){
    return '<button class="'+(x.id===theme?"on":"")+'" onclick="setTheme(\''+x.id+'\')">'+
      '<span class="swatch">'+x.sw.map(function(c){return '<i style="background:'+c+'"></i>';}).join("")+'</span>'+esc(themeName(x))+'</button>';
  }).join("");
}
function toggleThemeMenu(e){e.stopPropagation();renderThemeMenu();$("themeMenu").classList.toggle("hide");}
function setLang(l){
  lang=l; try{localStorage.setItem("om-lang",l);}catch(e){}
  if(rec){rec.lang=l;}
  paintStatic(); renderAgents(); renderStream(); renderThemeMenu();
}
function toggleNav(){navOpen=!navOpen;$("nav").classList.toggle("collapsed",!navOpen);$("navChev").textContent=navOpen?"‹":"›";}
function toggleSide(){sideOpen=!sideOpen;$("side").classList.toggle("collapsed",!sideOpen);$("sideChev").textContent=sideOpen?"›":"‹";}

/* ---------------- STATIC PAINT ---------------- */
function paintStatic(){
  $("hdrSub").textContent=t("subtitle");
  $("input").placeholder=t("placeholder");
  $("disc").textContent=t("disc");
  $("telLbl").textContent=t("telemetry");
  $("gridLbl").textContent=t("grid");
  $("wealthLbl").textContent=t("wealth");
  $("earnLbl").textContent=t("earnings");
  $("availLbl").textContent=t("avail");
  $("routeLbl").textContent=t("route");
  $("autoLbl").textContent=t("auto");
  $("wdBtn").textContent=t("withdraw");
  $("themeLbl").textContent=t("theme");
  $("micLbl").textContent=listening?t("listening"):t("voice");
  $("docCount").textContent=DOCS.length;

  $("langPill").innerHTML=LANGS.map(function(l){
    return '<button class="'+(l.code===lang?"on":"")+'" title="'+l.label+'" onclick="setLang(\''+l.code+'\')">'+l.short+'</button>';
  }).join("");
  $("langSel").innerHTML=LANGS.map(function(l){
    return '<option value="'+l.code+'"'+(l.code===lang?" selected":"")+'>'+l.native+'</option>';
  }).join("");
  $("routeSel").innerHTML=ROUTES.map(function(r){return '<option value="'+r.id+'">'+r.label+'</option>';}).join("");
  renderRoute();

  $("kpis").innerHTML=[["Soil","94%"],["Water","71%"],["Yield","1.18"],["Wallet","₹"+(balance/1000).toFixed(1)+"k"]].map(function(k){
    return '<div class="kpi"><p>'+k[0]+'</p><p class="mono" '+(k[0]==="Wallet"?'data-k="wallet"':'')+'>'+k[1]+'</p></div>';
  }).join("");

  $("navList").innerHTML=NAV.map(function(n,i){
    var label=lang==="gu-IN"?n.gu:lang==="hi-IN"?n.hi:n.en;
    return '<button class="navbtn'+(i===0?" on":"")+'" onclick="navClick('+i+',this)"><span>'+n.i+'</span><span class="lbl">'+esc(label)+'</span></button>';
  }).join("");
}
function navClick(i,el){
  Array.prototype.forEach.call(document.querySelectorAll(".navbtn"),function(b){b.classList.remove("on");});
  el.classList.add("on");
  if(NAV[i].act==="vault")openVault();
  if(NAV[i].act==="wealth"){sideOpen=true;$("side").classList.remove("collapsed");}
}

/* ---------------- BOOT ---------------- */
(function boot(){
  try{
    var st=localStorage.getItem("om-theme"); if(st)theme=st;
    var sl=localStorage.getItem("om-lang");  if(sl)lang=sl;
  }catch(e){}
  setTheme(theme);
  paintStatic();
  renderAgents();
  paintWealth();
  addMsg("om",t("welcome"),false,lang);

  // start with the telemetry drawer closed on small screens
  if(window.innerWidth<=640){ sideOpen=false; $("side").classList.add("collapsed"); $("sideChev").textContent="‹"; }

  // Esc closes any modal / popup, Ctrl+/ focuses the command bar
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
      $("modalHost").innerHTML="";
      $("plusMenu").classList.add("hide"); $("plusBtn").className="circ soft";
      $("themeMenu").classList.add("hide");
      if(window.speechSynthesis)window.speechSynthesis.cancel();
      if(listening&&rec)rec.stop();
    }
    if((e.ctrlKey||e.metaKey)&&e.key==="/"){ e.preventDefault(); $("input").focus(); }
  });
  // stop speech when the tab is hidden
  document.addEventListener("visibilitychange",function(){
    if(document.hidden&&window.speechSynthesis)window.speechSynthesis.cancel();
  });

  setInterval(function(){
    AGENTS.forEach(function(a){a.progress=Math.min(100,Math.round(a.progress+Math.random()*1.2));});
    balance=+(balance+Math.random()*40).toFixed(2);
    renderAgents(); paintWealth();
  },2500);
})();
</script>
